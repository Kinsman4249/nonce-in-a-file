# Deploy builder to Cloudflare Pages
#
# Deploys ONLY the builder bundle (the file-generation tool) to Cloudflare
# Pages on every push to main. Generated output files are one-off downloads
# produced in-browser and uploaded to Pages by hand when a new protected
# document is needed; they are never deployed by CI, so a builder deploy can
# never touch previously-uploaded output files.
#
# Keep this workflow separate from release.yml: this one deploys on every
# push to main, release.yml only runs on a version tag.
#
# ACTION PINNING: the wrangler-action `uses:` line is pinned to a major-version
# tag, matching the style used elsewhere in this repo. Do NOT auto-pin to a
# specific SHA (cloudflare/wrangler-action@v4) without asking the maintainer.

name: Deploy Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy builder to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The builder is pure static HTML/CSS/JS with no compile step, so its
      # source directory is almost its deployable output. The exceptions are
      # injected just-in-time here from repository variables so the owner can
      # change them without editing and committing source: the fixed "Learn
      # more" origin (LEARN_MORE_URL, required), the fixed Legal and Privacy
      # destinations (LEGAL_URL and PRIVACY_URL, required), the optional
      # top-left logo (LOGO_URL, applied only when set), and the optional
      # builder tab title (BUILDER_TITLE, applied only when set). We stage a
      # copy (builder-dist, gitignored) rather than mutating the tracked file,
      # then deploy the staged copy.
      - name: Stage builder and inject fixed links and optional logo
        env:
          LEARN_MORE_URL: ${{ vars.LEARN_MORE_URL }}
          LEGAL_URL: ${{ vars.LEGAL_URL }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          LOGO_URL: ${{ vars.LOGO_URL }}
          BUILDER_TITLE: ${{ vars.BUILDER_TITLE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LEARN_MORE_URL:-}" ]]; then
            echo "::error::The LEARN_MORE_URL Actions variable is not set."
            echo "Set it in Repository > Settings > Secrets and variables > Actions > Variables so every produced file links to a real, trusted origin. This deploy aborts rather than ship a placeholder or an empty destination."
            exit 1
          fi
          rm -rf builder-dist
          cp -r builder builder-dist
          node -e "
            var fs=require('fs');
            var file=process.argv[1];
            var url=process.env.LEARN_MORE_URL;
            var s=fs.readFileSync(file,'utf8');
            var key='LEARN_MORE_URL = ';
            var a=s.indexOf(key);
            var q=String.fromCharCode(39);
            var b=s.indexOf(q,a)+1;
            var c=s.indexOf(q,b);
            if(a<0||b<=0||c<0){ console.error('LEARN_MORE_URL variable not found in '+file); process.exit(1); }
            if(s.indexOf(url)!==-1){ console.log('LEARN_MORE_URL already '+url+' in staged copy'); }
            fs.writeFileSync(file,s.slice(0,b)+url+s.slice(c));
            console.log('Staged builder with LEARN_MORE_URL -> '+url);
          " builder-dist/index.html

          # Fixed Legal and Privacy destinations, mirroring the committed
          # defaults in the source: optional overrides, applied only when the
          # repository variable is set. When unset, the committed defaults (the
          # project's own LICENSE and PRIVACY.md on GitHub) stay in effect and
          # this never aborts the deploy, exactly like LOGO_URL / BUILDER_TITLE.
          for VAR in "LEGAL_URL" "PRIVACY_URL"; do
            val="${!VAR:-}"
            [[ -n "$val" ]] || continue
            MY_KEY="$VAR" MY_VAL="$val" node -e "
              var fs=require('fs');
              var file=process.argv[1];
              var url=process.env.MY_VAL;
              var KEY=process.env.MY_KEY;
              var s=fs.readFileSync(file,'utf8');
              var key=KEY+' = ';
              var a=s.indexOf(key);
              var q=String.fromCharCode(39);
              var b=s.indexOf(q,a)+1;
              var c=s.indexOf(q,b);
              if(a<0||b<=0||c<0){ console.error(KEY+' variable not found in '+file); process.exit(1); }
              if(s.indexOf(url)!==-1){ console.log(KEY+' already '+url+' in staged copy'); }
              fs.writeFileSync(file,s.slice(0,b)+url+s.slice(c));
              console.log('Staged builder with '+KEY+' -> '+url);
            " builder-dist/index.html
          done

          # Optional top-left logo: inject LOGO_URL only when the repository
          # variable is set. When unset, leave the placeholder empty so the
          # committed grey padlock stays the default mark in every generated
          # file. Unlike LEARN_MORE_URL this never aborts the deploy.
          if [[ -n "${LOGO_URL:-}" ]]; then
            node -e "
              var fs=require('fs');
              var file=process.argv[1];
              var url=process.env.LOGO_URL;
              var s=fs.readFileSync(file,'utf8');
              var key='LOGO_URL = ';
              var a=s.indexOf(key);
              var q=String.fromCharCode(39);
              var b=s.indexOf(q,a)+1;
              var c=s.indexOf(q,b);
              if(a<0||b<=0||c<0){ console.error('LOGO_URL variable not found in '+file); process.exit(1); }
              if(s.indexOf(url)!==-1){ console.log('LOGO_URL already '+url+' in staged copy'); }
              fs.writeFileSync(file,s.slice(0,b)+url+s.slice(c));
              console.log('Staged builder with LOGO_URL -> '+url);
            " builder-dist/index.html
          else
            echo "LOGO_URL not set; keeping the default grey padlock mark."
          fi

          # Optional builder tab title: inject BUILDER_TITLE only when the
          # repository variable is set. When unset, keep the committed default
          # title. Cosmetic only; never aborts the deploy.
          if [[ -n "${BUILDER_TITLE:-}" ]]; then
            node -e "
              var fs=require('fs');
              var file=process.argv[1];
              var url=process.env.BUILDER_TITLE;
              var s=fs.readFileSync(file,'utf8');
              var key='BUILDER_TITLE = ';
              var a=s.indexOf(key);
              var q=String.fromCharCode(39);
              var b=s.indexOf(q,a)+1;
              var c=s.indexOf(q,b);
              if(a<0||b<=0||c<0){ console.error('BUILDER_TITLE variable not found in '+file); process.exit(1); }
              if(s.indexOf(url)!==-1){ console.log('BUILDER_TITLE already '+url+' in staged copy'); }
              fs.writeFileSync(file,s.slice(0,b)+url+s.slice(c));
              console.log('Staged builder with BUILDER_TITLE -> '+url);
            " builder-dist/index.html
          else
            echo "BUILDER_TITLE not set; keeping the committed page title."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=nonce-in-a-file-builder
          workingDirectory: builder-dist